name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # اگر project.zip آپلود شده باشد، بازش می‌کند و فایل‌ها را در ریپو می‌گذارد
      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm project.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Add project files" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name book_summary_app --org com.example _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's/android:label="[^"]*"/android:label="خلاصه‌یار کتاب"/' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true

      - run: flutter pub get

      # رفع مشکل namespace در کتابخانه vosk_flutter (قدیمی است)
      - name: Patch vosk_flutter
        run: |
          python3 - <<'PY'
          import glob, os, re
          d = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/vosk_flutter-*/android'))[0]
          mp = d + '/src/main/AndroidManifest.xml'
          m = open(mp).read()
          found = re.search(r'package="([^"]*)"', m)
          pkg = found.group(1) if found else 'com.vosk.vosk_flutter'
          open(mp, 'w').write(re.sub(r'\s+package="[^"]*"', '', m, count=1))
          gp = d + '/build.gradle'
          g = open(gp).read()
          if 'namespace' not in g:
              g = re.sub(r'android\s*\{', 'android {\n    namespace "%s"' % pkg, g, count=1)
          open(gp, 'w').write(g)
          print('patched', pkg)
          # بالا بردن compileSdk همه پلاگین‌ها به 36
          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle*')):
              t = open(f).read()
              n = re.sub(r'(compileSdk(?:Version)?\s*=?\s*)(\d+)',
                         lambda mm: mm.group(1) + ('36' if int(mm.group(2)) < 36 else mm.group(2)), t)
              if n != t:
                  open(f, 'w').write(n)
                  print('compileSdk ->', f)
          PY
      - run: flutter build apk --release

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
